<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacturasApp Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>FacturasApp</h1>
        <span class="subtitle">Procesador de Facturas</span>
    </header>

    <!-- Zona de subida -->
    <section id="upload-zone" class="upload-zone">
        <div class="upload-content">
            <p>Arrastra PDFs o Excels aqui o</p>
            <label for="file-input" class="btn btn-upload">Seleccionar archivos</label>
            <input type="file" id="file-input" multiple accept=".pdf,.xlsx,.xls" hidden>
            <p class="upload-hint">PDF o Excel (.xlsx)</p>
        </div>
    </section>

    <!-- Barra de progreso -->
    <section id="progress-section" class="hidden">
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text">0%</span>
    </section>

    <!-- Archivos seleccionados -->
    <section id="files-section" class="hidden">
        <div class="section-header">
            <h2>Archivos seleccionados (<span id="file-count">0</span>)</h2>
            <div>
                <button id="btn-process" class="btn btn-primary">Procesar</button>
                <button id="btn-clear-files" class="btn btn-secondary">Limpiar</button>
            </div>
        </div>
        <ul id="file-list"></ul>
    </section>

    <!-- Filtros -->
    <section id="filters-section" class="hidden">
        <div class="filters">
            <input type="text" id="filter-text" placeholder="Buscar por numero, nombre o NIF...">
            <select id="filter-estado">
                <option value="Todos">Todos los estados</option>
                <option value="OK">Correcto</option>
                <option value="Revisar">Revisar</option>
                <option value="Error">Error</option>
                <option value="Duplicada">Duplicada</option>
                <option value="Pendiente">Pendiente</option>
            </select>
        </div>
    </section>

    <!-- Resumen -->
    <section id="summary-section" class="hidden">
        <div class="summary">
            <div class="summary-item"><span id="sum-total" class="sum-value">0</span><span class="sum-label">Total</span></div>
            <div class="summary-item ok"><span id="sum-ok" class="sum-value">0</span><span class="sum-label">Correcto</span></div>
            <div class="summary-item revisar"><span id="sum-revisar" class="sum-value">0</span><span class="sum-label">Revisar</span></div>
            <div class="summary-item error"><span id="sum-error" class="sum-value">0</span><span class="sum-label">Error</span></div>
            <div class="summary-item duplicada"><span id="sum-duplicada" class="sum-value">0</span><span class="sum-label">Duplicada</span></div>
            <div class="summary-item euros"><span id="sum-euros" class="sum-value">0,00</span><span class="sum-label">EUR</span></div>
        </div>
        <div class="export-buttons">
            <button id="btn-export-ingresos" class="btn btn-success">Exportar Ingresos</button>
            <button id="btn-export-gastos" class="btn btn-danger">Exportar Gastos</button>
            <button id="btn-clear" class="btn btn-secondary">Limpiar todo</button>
        </div>
    </section>

    <!-- Tabla de resultados -->
    <section id="results-section" class="hidden">
        <div class="table-container">
            <table id="facturas-table">
                <thead>
                    <tr>
                        <th>Nº Factura / Fecha</th>
                        <th>Emisor</th>
                        <th>Cliente</th>
                        <th>Base</th>
                        <th>IVA</th>
                        <th>IRPF</th>
                        <th>RE</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="facturas-tbody"></tbody>
            </table>
        </div>
    </section>

    <!-- Modal detalle -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Detalle de Factura</h2>
                <button id="modal-close" class="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
